<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="ТИШЕ — low-poly эхолокационный хоррор. Ты слеп в огромном лесу: твой микрофон — эхолокатор. Запусти пять генераторов и не закричи." />
    <title>ТИШЕ — эхолокационный хоррор</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script type="module" crossorigin src="./assets/main-CyIg-t9a.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/news-WLII5qIi.js">
  <link rel="stylesheet" crossorigin href="./assets/news-BQxFqynA.css">
  <link rel="stylesheet" crossorigin href="./assets/main-CebutEFP.css">
</head>
  <body>
    <noscript>
      <main style="max-width:720px;margin:40px auto;padding:0 18px;color:#d6cdc0;font:16px/1.6 monospace">
        <h1>ТИШЕ / HUSH</h1>
        <p>Бесплатный браузерный кооперативный хоррор: ночью в лесу ты слеп, а мир проявляется только эхом твоего голоса. Free co-op echolocation horror in the browser. Нужен JavaScript и WebGL2 · Needs JavaScript and WebGL2.</p>
        <p><a href="./about.html" style="color:#d6a04c">Об игре · About</a> · <a href="./privacy.html" style="color:#d6a04c">Политика конфиденциальности · Privacy policy</a></p>
      </main>
    </noscript>
    <canvas id="gl" tabindex="-1"></canvas>

    <!-- boot -->
    <div id="boot" class="screen show">
      <div class="boot-inner">
        <div class="sonar-loader"><i></i><i></i><i></i></div>
        <div id="bootText">лес растёт…</div>
        <button id="bootRetry" class="btn" type="button" hidden>ПОВТОРИТЬ</button>
      </div>
    </div>

    <!-- HUD: almost nothing. the dark is the interface. -->
    <div id="bars"><i></i><i></i></div>
    <div id="hud" class="hidden">
      <div id="dawnLine"><i id="dawnFill"></i></div>
      <div id="peek">
        <div id="peekTime">00:00</div>
        <div id="peekGens"><i></i><i></i><i></i><i></i><i></i></div>
        <div id="peekTask"></div>
        <div id="peekSub"></div>
      </div>
      <canvas id="radar"></canvas>
      <button id="pauseBtn" class="iconbtn" aria-label="pause">
        <svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
      </button>
      <div id="crosshair">
        <svg viewBox="-50 -50 100 100" aria-hidden="true">
          <circle id="screamRing" r="30" />
          <circle id="noiseRing" r="7" />
          <circle id="useRing" r="13" transform="rotate(-90)" />
          <circle id="cdRing" r="4.4" transform="rotate(-90)" />
        </svg>
        <div id="ripple"></div>
        <div id="beacon"><i></i></div>
        <div class="dot"></div>
        <div id="stam"><i id="stamFill"></i></div>
        <div id="stones"><i></i><i></i><i></i></div>
        <div id="flares"><i></i><i></i></div>
        <div id="glows"><i></i></div>
        <div id="torchBat"><i></i></div>
      </div>
      <div id="alert"></div>
      <div id="popups"></div>
      <div id="use"></div>
      <div id="pulse"></div>
      <div id="hint"></div>
      <div id="intro"></div>
      <div id="note"><div class="k"></div><div class="t"></div><div class="f"></div></div>
      <div id="skip"></div>
      <div id="lockHint"></div>
      <div id="mates"></div>
      <div id="spect"></div>
      <div id="beyond" aria-live="off"></div>
      <div id="qte" aria-live="polite">
        <div id="qteHint"></div>
        <div id="qteTrack"><b class="qline"></b></div>
        <div id="qteBars"><div class="qbar time"><i id="qteTime"></i></div><div class="qbar pull"><i id="qtePull"></i></div></div>
        <div id="qteWord"></div>
      </div>
    </div>

    <!-- touch controls -->
    <div id="touch">
      <div id="peekZone"></div>
      <div id="joyZone"></div>
      <div id="lookZone"></div>
      <div id="joyBase"><div id="joyKnob"></div></div>
      <button id="tPing" class="tbtn big"><span data-i18n="touchPing">ЭХО</span></button>
      <button id="tCrouch" class="tbtn"><span data-i18n="touchCrouch">ТИХО</span></button>
      <button id="tUse" class="tbtn"><span data-i18n="touchUse">РУКИ</span></button>
      <button id="tBag" class="tbtn" data-i18n="touchBag">РЮКЗАК</button>
          <button id="tItem" class="tbtn" data-i18n="touchItem">ПРЕДМЕТ</button>
          <button id="tAlt" class="tbtn" data-i18n="touchAlt">ЗАПИСЬ</button>
          <button id="tCarry" class="tbtn"><span class="a" data-i18n="touchCarry">НЕСТИ</span><span class="b" data-i18n="touchPutDown">ПОЛОЖИТЬ</span><span class="c" data-i18n="touchOut">ВЫЙТИ</span></button>
      <button id="tDescend" class="tbtn"><span data-i18n="touchDescend">ВНИЗ</span></button>
      <button id="tPull" class="tbtn big"><span data-i18n="touchPull">ТЯНИ</span></button>
      <button id="tSkip" class="tbtn wide"><span data-i18n="touchSkip">ПРОПУСТИТЬ</span></button>
    </div>

    <!-- main menu -->
    <div id="menu" class="screen">
      <button id="btnAtlas" class="atlas-object" type="button" hidden><span></span></button>
      <div id="homeRoomCaption" data-i18n="homeSector"></div>
      <div class="menu-wrap">
        <div class="title-block">
          <h1 class="title" id="titleText" data-text="ТИШЕ">ТИШЕ</h1>
          <div class="tagline" data-i18n="tagline"></div>
          <div class="menu-shift" data-i18n="homeNight"></div>
        </div>
        <div class="menu-main">
          <button class="btn primary" id="btnPlay"><span data-i18n="homeSolo">ОДНОМУ</span></button>
          <button class="btn" id="btnRange"><span data-i18n="homeRange">ПОЛИГОН</span></button>
          <button class="btn coop-btn" id="btnCoop"><span class="coop-ico" aria-hidden="true"><i></i><i></i></span><span id="btnCoopText" data-i18n="coopBtn">С ДРУЗЬЯМИ</span></button>
                    <button id="btnWardrobe" class="btn fig" type="button" aria-label="wardrobe">
            <span class="fig-stage" id="figStage"></span>
            <span class="fig-cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.2a1.9 1.9 0 1 0-1.9-1.9"/><path d="M12 7.2v1.3L3.2 15a1.3 1.3 0 0 0 .8 2.4h16a1.3 1.3 0 0 0 .8-2.4L12 8.5"/></svg><span></span></span>
          </button>
          <div class="book-clue" data-i18n="homeBookHint"></div>
          <div id="bestLine"></div>
          <nav class="menu-links">
            <button class="link" id="btnHow"><span data-i18n="howto"></span></button>
            <i>·</i>

            <i>·</i>
            <button class="link shop-link" id="btnShop"><svg class="gem-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l5.5 6.5L12 20.5 6.5 10z"/><path d="M6.5 10h11"/></svg><span data-i18n="shop"></span><b id="walletMenu">0</b></button>
            <i>·</i>
            <button class="link" id="btnScores"><span data-i18n="scores"></span></button>
            <i>·</i>
            <button class="link" id="btnSettings"><span data-i18n="settings"></span></button>
            <i>·</i>
            <a class="link" id="lnkPrivacy" href="./privacy.html" target="_blank" rel="noopener"><span data-i18n="privacyLink"></span></a>
          </nav>
          <div id="micPanel">
            <div class="mic-row">
              <span id="micStatus"></span>
              <button class="chip" id="micToggle"></button>
              <button class="chip mc-chip" id="micCalBtn" type="button"><span data-i18n="mcShort"></span></button>
            </div>
            <div id="micTest"><div class="bar"><div id="micTestFill"></div><div id="micTestTrig"></div></div><span data-i18n="micTest"></span></div>
            <div id="micWarn"></div>
          </div>
          <!-- your survivor: click it for the wardrobe -->

        </div>
        <section id="socialDock" aria-label="Friends">
          <div class="social-selfrow"><button id="btnAccount" class="social-portrait" data-portrait="true" type="button" aria-label="Личное дело"><canvas width="128" height="128"></canvas></button><div class="social-details"><strong class="social-name"></strong><span class="social-tag"></span><i class="social-sync"></i></div></div>
          <button type="button" class="social-add" data-social="add" data-action="social-add"></button>
          <h2 class="social-heading"></h2><div class="social-list"></div>
        </section>
        <div class="menu-foot">
          <div class="hp"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg><span data-i18n="headphones"></span></div>
          <aside id="news" class="news" aria-label="news"></aside>
          <button id="langBtn" class="chip">RU · EN</button>
        </div>
      </div>
    </div>

    <!-- pause -->
    <div id="pause" class="screen">
      <div class="panel center-panel">
        <h2 class="glitch-sm" data-i18n="paused">ПАУЗА</h2>
        <div id="pauseStats" class="mini-stats"></div>
        <button class="btn primary" id="btnResume"><span data-i18n="resume"></span></button>
        <button class="btn" id="btnRestartP"><span data-i18n="restart"></span></button>
        <button class="btn" id="btnSettingsP"><span data-i18n="settings"></span></button>
        <button class="btn" id="btnMenuP"><span data-i18n="menu"></span></button>
        <div id="pauseCoop" class="mini-note" data-i18n="pauseCoop"></div>
        <div id="pauseVoices" class="voice-list"><div class="vh" data-i18n="voicesHead">ГОЛОСА</div><div id="pauseVoiceRows"></div></div>
      </div>
    </div>

    <!-- game over / win -->
    <div id="over" class="screen">
      <div class="panel over-panel">
        <div id="overKicker"></div>
        <h2 id="overTitle" class="over-title"></h2>
        <div id="overSub"></div>
        <div id="newRecord" class="badge" data-i18n="newRecord"></div>
        <div id="overScore" class="big-score">0</div>
        <div id="overStats" class="stats-grid"></div>
        <div id="overWallet"></div>
        <div id="overTeam" class="team-table"></div>
        <div id="overTable" class="score-table compact"></div>
        <button class="btn hl-open" id="btnReel" type="button">
          <span class="hl-open-ico" aria-hidden="true">▶</span>
          <span data-i18n="hlOpen">СБОРНИК СМЕНЫ</span>
          <b id="reelCount"></b>
        </button>
        <div class="btn-row">
          <button class="btn primary" id="btnRestart"><span data-i18n="restart"></span></button>
          <button class="btn" id="btnLobby"><span data-i18n="toLobby"></span></button>
          <button class="btn" id="btnMenu"><span data-i18n="menu"></span></button>
        </div>
        <div class="restart-hint" id="restartHint" data-i18n="restartHint"></div>
      </div>
    </div>

    <!-- settings -->
    <div id="settingsPanel" class="screen modal">
      <div class="panel form-panel">
        <h2 class="settings-basic-title" data-i18n="settings"></h2>
        <div class="form settings-basic">
          <label><span data-i18n="sVolume"></span><input type="range" id="sVolume" min="0" max="1" step="0.01" /></label>
          <label><span data-i18n="sMusic"></span><input type="range" id="sMusic" min="0" max="1" step="0.01" /></label>
          <label><span data-i18n="sMouse"></span><input type="range" id="sMouse" min="0.2" max="3" step="0.05" /></label>
          <label class="check"><span data-i18n="sInvert"></span><input type="checkbox" id="sInvert" /></label>
          <label class="check"><span data-i18n="sMic"></span><input type="checkbox" id="sMic" /></label>
          <label><span data-i18n="sMicSens"></span><input type="range" id="sMicSens" min="0" max="1" step="0.01" /></label>
          <button class="chip mc-open" id="btnMicCal" type="button"><span data-i18n="mcOpen"></span></button>
          <label class="check"><span data-i18n="sEcho"></span><input type="checkbox" id="sEcho" /></label>
          <label class="check"><span data-i18n="sRadar"></span><input type="checkbox" id="sRadar" /></label>
          <label><span data-i18n="sScares"></span>
            <select id="sScares"><option value="full" data-i18n="sScaresFull"></option><option value="reduced" data-i18n="sScaresReduced"></option></select>
          </label>
          <label><span data-i18n="sQuality"></span>
            <select id="sQuality"><option value="auto" data-i18n="sQAuto"></option><option value="high" data-i18n="sQHigh"></option><option value="low" data-i18n="sQLow"></option></select>
          </label>
          <button class="btn gx-open" id="btnGraphicsAdvanced" type="button" aria-expanded="false" aria-controls="graphicsAdvanced"><span data-i18n="gxTitle"></span><b aria-hidden="true">↗</b></button>
          <label><span data-i18n="sLang"></span>
            <select id="sLang"><option value="ru">Русский</option><option value="en">English</option></select>
          </label>
        </div>
        <section id="graphicsAdvanced" hidden aria-labelledby="gxTitle"></section>
        <button class="btn primary" id="btnSettingsBack"><span data-i18n="back"></span></button>
      </div>
    </div>

    <!-- high scores -->
    <div id="scoresPanel" class="screen modal">
      <div class="panel form-panel">
        <h2 data-i18n="scores"></h2>
        <label class="callsign"><span data-i18n="callsign"></span><input id="nameInput" maxlength="14" autocomplete="off" spellcheck="false" placeholder="???" /></label>
        <div id="scoreTable" class="score-table"></div>
        <button class="btn primary" id="btnScoresBack"><span data-i18n="back"></span></button>
      </div>
    </div>

    <!-- co-op: rooms -->
    <div id="coopPanel" class="screen modal">
      <div class="panel form-panel coop">
        <h2 data-i18n="coopTitle">С ДРУЗЬЯМИ</h2>
        <div id="coopHome" class="coop-view">
          <label class="callsign"><span data-i18n="callsign"></span><input id="coopName" maxlength="14" autocomplete="off" spellcheck="false" placeholder="???" /></label>
          <p id="coopNameHint" class="callsign-locked" hidden></p>
          <button class="btn primary" id="btnCreate"><span data-i18n="coopCreate">СОЗДАТЬ КОМНАТУ</span></button>
          <div class="coop-or"><span data-i18n="coopOr">или войди по коду друга</span></div>
          <form class="coop-join" id="coopJoinForm" autocomplete="off">
            <input id="coopCode" maxlength="64" autocomplete="off" spellcheck="false" placeholder="K7Q2M" aria-label="code" />
            <button class="btn" id="btnJoin" type="submit"><span data-i18n="coopJoin">ВОЙТИ</span></button>
          </form>
          <div id="coopHomeMsg" class="coop-msg"></div>
          <div class="coop-note" data-i18n="coopNote"></div>
        </div>
        <!-- in a room: the garage (3D, behind) — everyone's name tag floats over their place -->
        <div id="coopRoom" class="coop-view">
          <div class="coop-top">
            <div class="coop-kicker"><span data-i18n="coopTitle">С ДРУЗЬЯМИ</span> · <span data-i18n="coopGarage">гараж</span><button id="btnLobbyFriends" class="chip" type="button">Друзья</button></div>
            <div class="coop-code">
              <span class="k" data-i18n="coopRoom">КОМНАТА</span>
              <b id="coopCodeOut">-----</b>
              <button class="chip" id="btnCopy"><span id="btnCopyText" data-i18n="coopCopy">скопировать ссылку</span></button>
            </div>
          </div>
          <div id="coopList"></div>
          <div id="coopGateHint" class="coop-gate-hint" hidden></div>
          <div class="coop-dock">
            <div id="coopStatus" class="coop-msg"></div>
            <div id="coopMicRow" class="coop-mic"><span id="coopMicText"></span><button class="chip" id="btnCoopMic"></button></div>
            <div class="coop-btns">
              <button class="btn" id="btnLeave"><span data-i18n="coopLeave">ВЫЙТИ ИЗ КОМНАТЫ</span></button>
              <button class="btn primary" id="btnStart"><span data-i18n="coopStart">НАЧАТЬ</span></button>
              <button class="btn" id="btnRoomBack"><span data-i18n="back"></span></button>
            </div>
          </div>
        </div>
        <button class="btn" id="btnCoopBack"><span data-i18n="back"></span></button>
      </div>
    </div>

    <!-- how to play -->
    <div id="howPanel" class="screen modal">
      <div class="panel form-panel how">
        <h2 data-i18n="howto"></h2>
        <div id="howBody"></div>
        <button class="btn primary" id="btnHowBack"><span data-i18n="back"></span></button>
      </div>
    </div>

    <!-- the shift's highlights: the night's stupidest moments, played back and saved as a file -->
    <div id="reelPanel" class="screen modal reel" role="dialog" aria-modal="true" aria-hidden="true" aria-label="highlight reel">
      <div class="panel reel-panel">
        <div class="reel-head">
          <h2 data-i18n="hlTitle">СБОРНИК СМЕНЫ</h2>
          <p class="reel-sub" data-i18n="hlSub"></p>
        </div>
        <div class="reel-stage">
          <canvas id="reelCanvas" width="320" height="180"></canvas>
          <div id="reelCap" class="reel-cap"></div>
          <div id="reelEmpty" class="reel-empty" hidden></div>
          <div class="reel-bar"><i id="reelProg"></i></div>
        </div>
        <div class="reel-strip" id="reelStrip" role="tablist"></div>
        <div class="btn-row reel-btns">
          <button class="btn" id="btnReelPlay" type="button"></button>
          <button class="btn reel-step" id="btnReelPrev" type="button" aria-label="previous">&larr;</button>
          <button class="btn reel-step" id="btnReelNext" type="button" aria-label="next">&rarr;</button>
          <button class="btn primary" id="btnReelSave" type="button"><span data-i18n="hlSave">СОХРАНИТЬ ВИДЕО</span></button>
          <button class="btn" id="btnReelClose" type="button"><span data-i18n="hlClose">ЗАКРЫТЬ</span></button>
        </div>
        <div class="restart-hint" id="reelHint" data-i18n="hlHint"></div>
        <div id="reelSaveState" class="reel-save-state" role="status"></div>
      </div>
    </div>

    <!-- the solo shift: how many nights — asked after the button, never on the menu itself -->
    <div id="soloPanel" class="screen modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="solo shift">
      <div class="panel form-panel solo-shift">
        <h2 data-i18n="soloShiftTitle">ДЛИНА СМЕНЫ</h2>
        <p class="solo-sub" data-i18n="soloShiftSub"></p>
        <figure class="solo-plate">
          <img id="soloMapPreview" src="maps/forest.png" alt="" width="440" height="560" decoding="async" />
          <figcaption><span id="soloMapCaption" data-i18n="mapPreview"></span><b id="soloMapNote"></b></figcaption>
        </figure>
        <div class="solo-maps" role="group" aria-label="участок">
          <button class="solo-map" type="button" data-map="forest"><b data-i18n="mapForest">ЛЕСХОЗ</b><span data-i18n="mapForestHint"></span></button>
          <button class="solo-map" type="button" data-map="bog"><b data-i18n="mapBog">ТОРФЯНИК</b><span data-i18n="mapBogHint"></span></button>
        </div>
        <div class="solo-nights">
          <button class="solo-night" type="button" data-days="2"><b data-i18n="days2">2 ночи</b><span data-i18n="daysHint2"></span></button>
          <button class="solo-night" type="button" data-days="4"><b data-i18n="days4">4 ночи</b><span data-i18n="daysHint4"></span></button>
          <button class="solo-night" type="button" data-days="6"><b data-i18n="days6">6 ночей</b><span data-i18n="daysHint6"></span></button>
        </div>
        <button class="btn" id="btnSoloBack"><span data-i18n="back">НАЗАД</span></button>
      </div>
    </div>

    <!-- the atlas: a field journal from the backpack at the camp -->
    <div id="atlasPanel" class="screen modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="atlas">
      <div class="book" tabindex="-1">
        <div class="book-top">
          <nav class="book-tabs" id="atlasTabs"></nav>
          <button class="book-close" id="atlasClose" aria-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
        </div>
        <div class="spread">
          <section class="page page-l" id="atlasLeft">
            <div class="plate" id="atlasPlate">
              <div class="plate-fx"></div>
              <i class="pc tl"></i><i class="pc tr"></i><i class="pc bl"></i><i class="pc br"></i>
              <div class="plate-hint" id="atlasHint"></div>
              <div class="plate-ruler" id="atlasRuler"><i></i><span></span></div>
              <div class="plate-stamp" id="atlasStamp"></div>
            </div>
            <div class="plate-cap" id="atlasCap"></div>
            <div class="page-foot l"><span class="pno" id="atlasPnoL"></span></div>
          </section>
          <section class="page page-r" id="atlasRight"></section>
          <div class="leaf" id="atlasLeaf"><div class="leaf-face leaf-front"></div><div class="leaf-face leaf-back"></div></div>
        </div>
      </div>
    </div>

    <!-- the wardrobe: what you wear out there (and how your friends see you) -->
    <div id="wardrobePanel" class="screen modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="wardrobe">
      <div class="wr" tabindex="-1">
        <div class="wr-stage plate" id="wrStage">
          <div class="plate-fx"></div>
          <i class="pc tl"></i><i class="pc tr"></i><i class="pc bl"></i><i class="pc br"></i>
          <div class="wr-tag" id="wrTag"></div>
          <div class="wardrobe-neutral" data-i18n="wardrobeNeutral"></div>
          <div class="plate-hint wr-hint" id="wrHint"></div>
          <div class="plate-stamp wr-set" id="wrSet"></div>
          <div class="wr-toast" id="wrToast"></div>
        </div>
        <div class="wr-side">
          <div class="wr-head">
            <h2 class="wr-title" id="wrTitle"></h2>
            <div class="wr-wallet" id="wrWallet"></div>
            <button class="book-close" id="wrClose" aria-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
          </div>
          <div class="wr-sub" id="wrSub"></div>
          <div class="closet-stamp" data-i18n="closetStamp"></div>
          <nav class="wr-slots" id="wrSlots" role="tablist"></nav>
          <div class="wr-modes" id="wrModes"><button type="button" data-wr-mode="items" data-i18n="wardrobeItems"></button><button type="button" data-wr-mode="paint" data-i18n="wardrobePaintTab"></button></div>
          <div class="wr-items" id="wrItems" role="listbox"></div>
          <div class="wr-info" id="wrInfo"></div>
          <div class="wr-paint"><h4 data-i18n="wardrobePaint"></h4>
            <div class="wr-parts" id="wrParts"></div>
            <div class="wr-swatches" id="wrSwatches"></div>
          </div>
          <div class="wr-actions">
            <button class="chip wr-act" id="wrRandom"></button>
            <button class="chip wr-act" id="wrReset"></button>
          </div>
          <div class="wr-note" id="wrNote"></div>
          <button class="btn primary wr-done" id="wrDone"></button>
        </div>
      </div>
    </div>

    <div id="micCalPanel" class="screen modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="microphone"></div>

    <div id="noise-overlay"></div>
  </body>
</html>
