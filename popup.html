<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pinwave</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="brand">
      <div class="logo">p<span>✦</span></div>
      <div><h1>Pinwave</h1><p>Твой Pinterest. Твои правила.</p></div>
      <span class="live-dot" title="Расширение активно"></span>
    </header>
    <section class="intro"><span class="eyebrow">ПЕРСОНАЛИЗАЦИЯ</span><h2>Сделай ленту<br>своей.</h2><p>Настройки применяются сразу на открытой вкладке Pinterest.</p></section>
    <section class="controls" aria-label="Настройки внешнего вида">
      <label class="setting"><span class="setting-icon moon">◐</span><span class="setting-copy"><b>Чёрная тема</b><small>Глубокий чёрный и чистый интерфейс</small></span><input type="checkbox" data-setting="dark"><span class="switch"></span></label>
      <label class="setting"><span class="setting-icon grid">▦</span><span class="setting-copy"><b>Плотная сетка</b><small>Больше пинов на экране</small></span><input type="checkbox" data-setting="compact"><span class="switch"></span></label>
      <label class="setting"><span class="setting-icon focus">◎</span><span class="setting-copy"><b>Режим фокуса</b><small>Спрятать лишнее и смотреть идеи</small></span><input type="checkbox" data-setting="focus"><span class="switch"></span></label>
    </section>
    <footer><span>Сделано для вдохновения</span><span class="version">v1.0</span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
