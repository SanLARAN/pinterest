# ТИШЕ / HUSH — the Windows build.
#
# (3.1d) Two files per release:
#   HUSH-Setup-<v>.exe        the installer: per-user (no admin), Start menu + desktop shortcut, opens the launcher.
#                             The launcher keeps it current — the game part from each release's .pak, and the shell
#                             by re-running the newest installer silently when it changed (electron/updater.cjs).
#   HUSH-<v>-win-x64.exe      the portable build, for a USB stick: same launcher, swaps its own file to update.
# The web build in ./dist is packed into the app (asar) and served over hush:// by electron/main.cjs.
# Build locally:  npm run build && npm run desktop:win
# In CI:          .github/workflows/desktop.yml (Actions → Desktop (HUSH) → Run workflow)
appId: ru.hush.echolocation
productName: HUSH
copyright: ТИШЕ / HUSH

# electron-builder normally reads the version from devDependencies; the desktop deps are installed on demand, so
# the version is pinned here (it must match the workflow's `npm i --no-save electron@…`).
electronVersion: 45.0.0

directories:
  output: release
  buildResources: electron/assets

files:
  - electron/main.cjs
  - electron/serve.cjs
  - electron/update.cjs
  - electron/oauth.cjs
  - electron/preload.cjs
  - electron/preload-launcher.cjs
  - electron/updater.cjs
  - electron/content.cjs
  - electron/pak.cjs
  - electron/net.cjs
  - electron/assets/**
  # (3.1k) the installer's own art and script sit beside the icon, but the app does not need them
  - '!electron/assets/*.bmp'
  - '!electron/assets/*.nsh'
  - dist/**
  - package.json

asar: true
compression: maximum

win:
  icon: electron/assets/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: HUSH-${version}-win-${arch}.${ext}

# (3.1k) the installer is a wizard now: Welcome → only me / everyone → the folder → Shortcuts → Finish, in Russian or
# English after the Windows language, with the game's own art. Its pages, words and the uninstaller's question about
# the saves are in electron/assets/installer.nsh; the art (installerSidebar.bmp, uninstallerSidebar.bmp,
# installerHeader.bmp) is found there by name. «Only me» stays the default: no UAC prompt, and silent updates.
# The launcher runs a newer installer with `/S --updated` to update the shell in place — into the folder the player
# picked (the installer reads it back from the registry).
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  multiLanguageInstaller: true
  installerLanguages: [ru_RU, en_US]
  displayLanguageSelector: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ТИШЕ HUSH
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: HUSH-Setup-${version}.${ext}

portable:
  artifactName: HUSH-${version}-win-${arch}.${ext}
  # hush:// is our own scheme, so nothing has to be registered system-wide and the game never needs admin
  requestExecutionLevel: user
