# ТИШЕ / HUSH — the Windows build.
#
# (3.1d) Two files per release:
#   HUSH-Setup-<v>.exe        the installer: per-user (no admin), Start menu + desktop shortcut, opens the launcher.
#                             The launcher keeps it current — the game part from each release's .pak, and the shell
#                             by re-running the newest installer silently when it changed (electron/updater.cjs).
#   HUSH-<v>-win-x64.exe      the portable build, for a USB stick: same launcher, swaps its own file to update.
# The web build in ./dist is packed into the app (asar) and served over hush:// by electron/main.cjs.
# Build locally:  npm run build && npm run desktop:win
# In CI:          .github/workflows/desktop.yml (Actions → Desktop (HUSH) → Run workflow)
appId: ru.hush.echolocation
productName: HUSH
copyright: ТИШЕ / HUSH

# electron-builder normally reads the version from devDependencies; the desktop deps are installed on demand, so
# the version is pinned here (it must match the workflow's `npm i --no-save electron@…`).
electronVersion: 45.0.0

directories:
  output: release
  buildResources: electron/assets

files:
  - electron/main.cjs
  - electron/serve.cjs
  - electron/update.cjs
  - electron/oauth.cjs
  - electron/preload.cjs
  - electron/preload-launcher.cjs
  - electron/updater.cjs
  - electron/content.cjs
  - electron/pak.cjs
  - electron/net.cjs
  - electron/assets/**
  - dist/**
  - package.json

asar: true
compression: maximum

win:
  icon: electron/assets/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: HUSH-${version}-win-${arch}.${ext}

# (3.1d) the installer: one click, into the user's own profile (no UAC prompt), shortcuts, and the game starts at
# the end. The launcher runs a newer one of these with `/S --updated` to update the shell in place.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ТИШЕ HUSH
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: HUSH-Setup-${version}.${ext}

portable:
  artifactName: HUSH-${version}-win-${arch}.${ext}
  # hush:// is our own scheme, so nothing has to be registered system-wide and the game never needs admin
  requestExecutionLevel: user
