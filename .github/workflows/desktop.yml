# The desktop build of ТИШЕ / HUSH: an installer with a launcher that keeps itself current (3.1d).
#
# Runs by hand (Actions → "Desktop (HUSH)" → Run workflow) and on every arena/* tag, next to the Pages deploy.
# What a tag's release carries (the launcher reads it from «the latest release»):
#   • HUSH-Setup-1.0.<n>.exe     the installer (what players download once);
#   • HUSH-1.0.<n>-win-x64.exe   the portable build;
#   • hush-game-1.0.<n>.pak      the game alone (~7 MB): installed copies pull this and nothing else;
#   • hush-manifest.json         versions, sizes, sha-256 and the shell's fingerprint (scripts/pack-game.cjs).
# Also: the same files as a workflow artifact ("HUSH-win-x64"), and Google Drive if GDRIVE_SA is set.
name: Desktop (HUSH)

on:
  workflow_dispatch:
  push:
    tags: ['arena/*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    # at job level, so the Drive step's `if:` can see it (a step cannot test an env var it declares itself)
    env:
      GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
      GDRIVE_FOLDER: ${{ vars.GDRIVE_FOLDER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the same guards as the web deploy: a desktop build of a broken game is not worth shipping.
      # On a failure the run's log is the only place with the detail, and it is not always readable from a
      # phone or from a proxy — so the failing lines are repeated as annotations and kept as a file.
      - name: Test
        shell: bash
        run: |
          node -v
          npm -v
          status=0
          npm test > test.log 2>&1 || status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            # the run's log is the only other place with the detail, and it is not reachable from everywhere
            # GitHub keeps about ten annotations per step, so: which tests, then why
            { grep -E "^not ok" test.log | head -3
              grep -E "^ *(error|expected|actual|location):" test.log | head -6
            } | tr -d '\r' | while IFS= read -r line; do
              echo "::error title=Test failed::${line}"
            done
            exit "$status"
          fi

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows
          path: test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build the web bundle
        run: npm run build

      # the desktop deps are installed here, not in package.json: the Pages deploy stays light and the exe is
      # still built from exactly the versions pinned in electron-builder.yml
      - name: Install Electron and electron-builder
        run: npm i --no-save electron@45.0.0 electron-builder@26.15.3

      # (3.0m) the portable build updates itself: it asks GitHub for the newest release and compares versions.
      # A tag like `arena/live47` says nothing about what is inside, so the run number is stamped into the
      # version here — electron-builder then names the file HUSH-1.0.<n>-win-x64.exe, and that number is the
      # one the updater reads, both from its own app.getVersion() and from the asset name on the release.
      - name: Stamp the build number
        shell: bash
        run: npm pkg set version="1.0.${{ github.run_number }}" && node -p "require('./package.json').version"

      - name: Pack the installer and the portable .exe
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          # unsigned builds: no certificate is configured, and electron-builder must not go looking for one
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # (3.1d) the launcher's half of the release: the game as a .pak, and the manifest with every hash
      - name: Pack the game and the manifest
        run: node scripts/pack-game.cjs --dist dist --out release

      - name: What came out
        shell: bash
        run: ls -la release && du -h release/*.exe release/*.pak && cat release/hush-manifest.json

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: HUSH-win-x64
          path: |
            release/*.exe
            release/*.pak
            release/hush-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/arena/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.pak
            release/hush-manifest.json
          # the launcher reads «the latest release»: this one has to be it
          make_latest: true
          name: ТИШЕ / HUSH ${{ github.ref_name }}
          body: |
            **Установка:** скачай `HUSH-Setup-….exe` и запусти — без прав администратора, ярлыки на рабочем столе
            и в «Пуске». Откроется лаунчер: ИГРАТЬ, что нового, обновления.

            **Обновляется сама.** Лаунчер при каждом запуске (и раз в три часа) смотрит сюда. Новая игра — это файл
            `hush-game-….pak` на несколько мегабайт: он скачивается и проверяется сам, переустанавливать ничего не
            нужно. Если поменялась сама оболочка, лаунчер тихо скачает новый установщик и поставит его при выходе.

            Без установки: `HUSH-…-win-x64.exe` — портативная сборка, тоже с лаунчером и обновлениями.

            **Install:** download `HUSH-Setup-….exe` and run it — no admin rights, desktop and Start menu shortcuts.
            The launcher keeps the game current on its own. No install: `HUSH-…-win-x64.exe` (portable).

            Windows может показать «Система Windows защитила ваш компьютер»: сборка не подписана сертификатом —
            «Подробнее» → «Выполнить в любом случае». Windows may warn that the app is unsigned: More info → Run anyway.

            Микрофон: игра спросит разрешение при первом запуске (система может переспросить в «Параметрах конфиденциальности»).
            Microphone: the game asks on first run (Windows may also ask in Privacy settings).

      # Google Drive: skipped unless the repository has the GDRIVE_SA secret (a service-account JSON key).
      # The folder in GDRIVE_FOLDER (a repository variable) must be shared with that service account's e-mail.
      - name: Upload to Google Drive
        if: env.GDRIVE_SA != ''
        shell: pwsh
        run: |
          if (-not $env:GDRIVE_FOLDER) { $env:GDRIVE_FOLDER = 'HUSH' }
          Invoke-WebRequest -Uri https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath rclone
          $rclone = (Get-ChildItem rclone -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          $env:GDRIVE_SA | Out-File -FilePath sa.json -Encoding utf8
          & $rclone config create gdrive drive service_account_file sa.json scope drive --config rclone.conf
          $exe = (Get-ChildItem release -Filter 'HUSH-Setup-*.exe' | Select-Object -First 1).FullName
          & $rclone copy $exe "gdrive:$env:GDRIVE_FOLDER" --config rclone.conf --verbose
          Remove-Item sa.json
