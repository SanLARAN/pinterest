name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/ee754852-pinterest]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The simulation is pure and Node-importable, so CI plays the game headlessly
      # (a bot loots every body and repairs all 5 generators) and verifies the UI wiring
      # and build freshness before we publish anything.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # The github-pages environment on this repo currently allows deployment from one
  # specific branch only, so deploying from a feature branch can never succeed.
  # Build (and test) on every push, publish from main or on a manual dispatch.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
