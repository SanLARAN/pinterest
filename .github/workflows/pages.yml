# GitHub Pages for the game: https://sanlaran.github.io/pinterest/
#
# Two ways Pages can be set up (Settings → Pages → Build and deployment → Source):
#  • "GitHub Actions" (current): this workflow builds dist/ and deploys it itself — the game is at the
#    site root. The prebuilt ./play/ rides along at /play/, so links from the other mode keep working.
#  • "Deploy from a branch": Pages serves this branch as-is. The root index.html redirects to ./play/,
#    a prebuilt copy committed with the sources (`npm run build:pages`).
# Either way this workflow checks that ./play/ matches the sources, so a stale copy can't slip through.
name: Pages (HUSH)

on:
  push:
    branches: [arena/2a2936ce-pinterest]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.mode.outputs.build_type }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Prebuilt ./play/ is up to date
        run: |
          npm run build:pages
          if [ -n "$(git status --porcelain -- play)" ]; then
            git status --short -- play
            echo "::error::./play/ is stale — run 'npm run build:pages' and commit it"
            exit 1
          fi
      - name: How is Pages set up?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Pages build_type: $mode"
          echo "build_type=$mode" >> "$GITHUB_OUTPUT"
      - name: Old /play/ links keep working
        if: steps.mode.outputs.build_type == 'workflow'
        run: cp -r play dist/play
      - if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v6
      - if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
